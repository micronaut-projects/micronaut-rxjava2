plugins {
    id 'java-library'
    id 'io.micronaut.build.internal.rxjava2-test-suite'
    id 'io.micronaut.build.internal.python'
}

// The examples of the guide, in Python, compiled by the Python compiler (micronaut-inject-python). The compiler
// takes the (jar-resolved) compile classpath as its annotation processor path, so the Micronaut processors are
// regular test dependencies rather than annotationProcessor ones. The Python tests only run with -Ppython-ci.
//
// The Python compiler ships with Micronaut core 5.2+, which this branch does not use: only this suite resolves
// that core version and the matching test module (see gradle/libs.versions.toml).
micronautBuild {
    // the Python runtime (Micronaut core 5.2) requires Java 25, unlike the rest of this branch (Java 17)
    javaVersion = 25
    python {
        compilerVersion.set(libs.versions.micronaut.python)
    }
}

dependencies {
    testImplementation(platform(libs.micronaut.core.python))
    testImplementation(platform(libs.micronaut.test.python))

    testImplementation libs.micronaut.inject.python.test
    testImplementation libs.micronaut.context.python

    testImplementation projects.micronautRxjava2HttpClient
    testImplementation projects.micronautRxjava2HttpServerNetty
    testImplementation "io.micronaut:micronaut-http-server-netty"
    testImplementation "io.micronaut:micronaut-jackson-databind"
    testImplementation "io.micronaut.test:micronaut-test-junit5"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly mnLogging.logback.classic
}

tasks.withType(Test).configureEach {
    systemProperty "micronaut.python.pool.enabled", "false"
}
