[versions]
managed-rxjava2 = "2.2.21"

groovy = '4.0.29'
spock = "2.3-groovy-4.0"

micronaut = "4.10.8"
micronaut-docs = "3.0.0"
micronaut-test = "4.9.0"
micronaut-validation = "4.11.0"

# The Python compiler (micronaut-inject-python) of test-suite-python ships with Micronaut core 5.2+, which this branch
# does not use: only that suite resolves these Micronaut 5 versions of core and test
micronaut-python = "5.2.3"
micronaut-test-python = "5.1.1"

[libraries]
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
managed-rxjava2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "managed-rxjava2" }
groovy-json = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }

micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }

micronaut-core-python = { module = "io.micronaut:micronaut-core-bom", version.ref = "micronaut-python" }
micronaut-inject-python-test = { module = "io.micronaut:micronaut-inject-python-test" }
micronaut-context-python = { module = "io.micronaut:micronaut-context-python" }
micronaut-test-python = { module = "io.micronaut.test:micronaut-test-bom", version.ref = "micronaut-test-python" }
